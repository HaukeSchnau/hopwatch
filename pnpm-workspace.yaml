allowBuilds:
  # Copies the prebuilt Skia libraries for iOS and Android into the package.
  '@shopify/react-native-skia': true
  # eas-cli's: bunyan's optional DTrace probes, and a notice after protobufjs installs.
  dtrace-provider: false
  protobufjs: false
  unrs-resolver: false
  workerd: false
patchedDependencies:
  # Finds the presenting window through the foreground scene, so Slack's sign-in sheet opens
  # under the UIScene life cycle (expo/expo#50368).
  # TODO: drop with expo-web-browser 58.0.1 or later, which has the fix (SDK 58).
  expo-web-browser@57.0.3: patches/expo-web-browser@57.0.3.patch
minimumReleaseAgeExclude:
  - "@schnau/tsconfig"
  # Vite+ 1.8.0 came out between 02:16 and 03:15 UTC on 2026-11-24, and pnpm also checks the
  # lockfile against minimumReleaseAge. Delete these entries after 2026-11-25T03:16Z.
  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
  - vite-plus@1.8.0
pmOnFail: error
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
overrides:
  vite@*: "catalog:"
