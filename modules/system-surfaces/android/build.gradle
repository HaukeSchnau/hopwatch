plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.systemsurfaces'
version = '1.0.0'

android {
  namespace "expo.modules.systemsurfaces"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Headless.kt starts the app's JavaScript task through React Native's ReactHost.
  implementation 'com.facebook.react:react-android'
}
