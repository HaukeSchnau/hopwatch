// Gradle init script for Android builds on a builder with a read-only Android SDK
// (scripts/play-internal.sh passes it with --init-script).
// Such an SDK holds only the NDK and build tools React
// Native asks for (rootProject.ext.ndkVersion and buildToolsVersion). Modules that don't pin
// them, such as expo and expo-updates, would get AGP's defaults instead, which Gradle then
// fails to install. This points every Android module at React Native's versions.
//
// TODO: drop once the builder's SDK also ships AGP's default NDK and build tools.
allprojects {
  ['com.android.library', 'com.android.application'].each { id ->
    plugins.withId(id) {
      android.ndkVersion = rootProject.ext.ndkVersion
      android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
  }
}
